name: rules-micronaut-hello-world
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hello
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: hello
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hello", "-d", "hello"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres-data:
