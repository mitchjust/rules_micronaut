name: CI
# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  # Cancel previous actions from the same PR or branch except 'main' branch.
  # See https://docs.github.com/en/actions/using-jobs/using-concurrency and https://docs.github.com/en/actions/learn-github-actions/contexts for more info.
  group: concurrency-group::${{ github.workflow }}::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}${{ github.ref_name == 'main' && format('::{0}', github.run_id) || ''}}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # 8.4.0 is the minimum declared in MODULE.bazel bazel_compatibility.
        bazel: ["8.4.0", "8.x", "9.x"]
        folder:
          - .
          - e2e/smoke
          - examples/hello-world
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          bazelrc: |
            ${{ matrix.folder == '.' && 'common --config=ci ' || '' }}
            ${{ matrix.folder == '.' && !startsWith(matrix.bazel, '9.') && 'common --lockfile_mode=update' || '' }}
      - run: bazel test //...
      - name: Test minimum rules_java version
        if: ${{ matrix.folder == 'e2e/smoke' }}
        run: |
          # rules_jvm_external selects a newer version, so force our declared minimum.
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = r'bazel_dep\(name = "rules_java", version = "([^"]+)"\)'
          minimum = re.search(pattern, Path("../../MODULE.bazel").read_text())
          module = Path("MODULE.bazel")
          contents, count = re.subn(pattern, minimum[0], module.read_text())
          assert count == 1, "Expected one rules_java dependency in the smoke module"
          contents += f'\nsingle_version_override(module_name = "rules_java", version = "{minimum[1]}")\n'
          module.write_text(contents)
          PY
          bazel test //... --lockfile_mode=off
      - name: Build example deploy jar
        if: ${{ matrix.folder == 'examples/hello-world' }}
        run: bazel build //:app_deploy.jar
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    needs: [test, pre-commit]
    runs-on: ubuntu-26.04
    if: always()
    steps:
      - uses: technote-space/workflow-conclusion-action@45ce8e0eb155657ab8ccf346ade734257fd196a5 # v3.0.3
      # Note: possible conclusion values:
      # https://github.com/technote-space/workflow-conclusion-action/blob/main/src/constant.ts
      - name: report success
        if: ${{ env.WORKFLOW_CONCLUSION == 'success' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 0
      - name: report failure
        if: ${{ env.WORKFLOW_CONCLUSION == 'failure' }}
        working-directory: /tmp
        run: echo ${{ env.WORKFLOW_CONCLUSION }} && exit 1
